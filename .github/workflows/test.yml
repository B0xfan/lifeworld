name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  self-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (esbuild, src/ to main.js)
        run: npm run build
      - name: Syntax check of the built file
        run: node --check main.js
      - name: Self-checks (no vault needed)
        run: node tests/run-all.js
